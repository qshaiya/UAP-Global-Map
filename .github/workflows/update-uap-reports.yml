name: Daily UAP report update

on:
  schedule:
    # Runs every day at 09:00 JST / 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-uap-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run UAP updater
        run: python scripts/update_uap_reports.py

      - name: Commit updated UAP reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update UAP reports"
          file_pattern: data/uap_reports.json
          commit_user_name: uap-map-bot
          commit_user_email: actions@github.com
          commit_author: uap-map-bot <actions@github.com>
